name: Daily Kaitori Bot

on:
  schedule:
    # 毎日 日本時間 11:00（UTC 02:00）
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 日本語フォントのインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ipafont-gothic

      - name: ライブラリのインストール
        run: |
          pip install -r requirements.txt
          # Playwright用ブラウザのセットアップ
          playwright install chromium --with-deps

      - name: 競合店の最新画像を取得
        env:
          # 監視したい競合のXアカウント名（@なし）
          TARGET_X_USERNAME: "kintaro_ikebukuro"
        run: |
          python fetch_competitor.py

      - name: 買取表解析・生成・LINE送信
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python main.py
